<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with smooth rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Subtle inner border -->
  <rect x="6" y="6" width="500" height="500" rx="122" fill="none" stroke="rgba(245, 158, 11, 0.15)" stroke-width="4"/>

  <!-- Audiobook Headphone Arch -->
  <path d="M 140 250 A 116 116 0 0 1 372 250" fill="none" stroke="url(#accent)" stroke-width="28" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Left Ear Cushion -->
  <rect x="122" y="240" width="36" height="88" rx="18" fill="url(#accent)"/>
  <rect x="136" y="254" width="16" height="60" rx="8" fill="#0f172a"/>
  
  <!-- Right Ear Cushion -->
  <rect x="354" y="240" width="36" height="88" rx="18" fill="url(#accent)"/>
  <rect x="360" y="254" width="16" height="60" rx="8" fill="#0f172a"/>

  <!-- Open Book & Soundwaves in Center -->
  <g transform="translate(196, 260)">
    <!-- Book pages -->
    <path d="M 60 40 Q 30 20 0 35 L 0 85 Q 30 70 60 90 Q 90 70 120 85 L 120 35 Q 90 20 60 40 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Spine center line -->
    <line x1="60" y1="40" x2="60" y2="90" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Audio Wave lines emanating upward -->
    <path d="M 40 8 Q 60 0 80 8" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
    <path d="M 28 -8 Q 60 -20 92 -8" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
    <path d="M 16 -24 Q 60 -40 104 -24" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
