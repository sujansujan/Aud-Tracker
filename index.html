<!doctype html>
<html lang="en" data-theme="alucard">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Audible Release Tracker</title>
    <meta name="description" content="Track upcoming audiobook releases from Audible, follow authors, narrators, and series, get 1-week, 1-day, and release-day reminders, and log your reading history." />
    <meta property="og:title" content="Audible Release Tracker" />
    <meta property="og:description" content="Track upcoming audiobook releases from Audible, follow authors, narrators, and series, get 1-week, 1-day, and release-day reminders, and log your reading history." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f8f8f2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AudioTracker" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- Google Fonts for crisp typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <script>
      // Gracefully ignore Vite HMR WebSocket errors per environment constraints
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          String(event.reason).includes('WebSocket') ||
          String(event.reason?.message).includes('WebSocket') ||
          String(event.reason).includes('vite')
        )) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (event.message && (
          event.message.includes('WebSocket') ||
          event.message.includes('[vite]')
        )) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body class="antialiased select-none" style="background-color: var(--md-sys-color-background, #f8f8f2); color: var(--md-sys-color-on-surface, #282a36);">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
