name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: 'true'
  CAPACITOR_TELEMETRY: 'false'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install || npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare and Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Android platform not found in repository. Initializing Capacitor Android..."
            npx cap add android
          fi
          # Ensure stable Android SDK 34 is targeted
          sed -i 's/compileSdkVersion = 36/compileSdkVersion = 34/g' android/variables.gradle 2>/dev/null || true
          sed -i 's/targetSdkVersion = 36/targetSdkVersion = 34/g' android/variables.gradle 2>/dev/null || true
          npx cap sync android

      - name: Build Android APK via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudibleTracker-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
